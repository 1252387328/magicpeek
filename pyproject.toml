[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magicpeek"
version = "0.1.0"
description = "Compare a file's real type — read from its magic bytes — with what its extension claims. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["file", "magic", "mime", "extension", "sniff", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Utilities",
]

[project.scripts]
magicpeek = "magicpeek.cli:main"

[tool.setuptools]
packages = ["magicpeek"]
